services:
  api:
    build:
      context: .
      dockerfile: apps/api/.docker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      # Set to image-scraper:50051 when running the scraper profile.
      IMAGE_SCRAPER_URL: ${IMAGE_SCRAPER_URL:-}
    volumes:
      - parts-data:/data

  # Optional supplier-link image scraping (headless Chromium):
  #   IMAGE_SCRAPER_URL=image-scraper:50051 docker compose --profile scraper up -d
  image-scraper:
    profiles: [scraper]
    build:
      context: .
      dockerfile: apps/image-scraper/.docker/Dockerfile
    init: true
    restart: unless-stopped
    volumes:
      - scraper-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/.docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

  # Green-screen telnet terminal (MC9090 / any VT220): telnet <host> 23
  terminal:
    build: apps/terminal
    init: true
    restart: unless-stopped
    environment:
      # Shown top right of every screen, to tell environments apart.
      SYSTEM_NAME: ${SYSTEM_NAME:-SCPROD}
      # Screen size when the client doesn't report one (MC9090 fits 28x16).
      TERM_COLS: ${TERM_COLS:-28}
      TERM_ROWS: ${TERM_ROWS:-16}
    volumes:
      - parts-data:/data
    ports:
      - "${TERMINAL_PORT:-23}:2323"

  # One-off commands: `docker compose run --rm cli import`.
  cli:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/cli/.docker/Dockerfile
    init: true
    volumes:
      - parts-data:/data

volumes:
  parts-data:
  scraper-data:
