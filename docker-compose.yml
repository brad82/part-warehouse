services:
  api:
    build:
      context: .
      dockerfile: apps/api/.docker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      # Set to image-scraper:50051 when running the scraper profile.
      IMAGE_SCRAPER_URL: ${IMAGE_SCRAPER_URL:-}
      # Printers for labels (Settings → Printers & devices) come from this CUPS
      # server, e.g. host.docker.internal (the host must share its printers).
      CUPS_SERVER: ${CUPS_SERVER:-}
    volumes:
      - parts-data:/data

  # Optional supplier-link image scraping (headless Chromium):
  #   IMAGE_SCRAPER_URL=image-scraper:50051 docker compose --profile scraper up -d
  image-scraper:
    profiles: [scraper]
    build:
      context: .
      dockerfile: apps/image-scraper/.docker/Dockerfile
    init: true
    restart: unless-stopped
    volumes:
      - scraper-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/.docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

  # One-off commands: `docker compose run --rm cli import`.
  cli:
    profiles: [tools]
    build:
      context: .
      dockerfile: apps/cli/.docker/Dockerfile
    init: true
    volumes:
      - parts-data:/data

volumes:
  parts-data:
  scraper-data:
